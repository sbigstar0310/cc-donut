# OpenRouter model catalog — read by ccd.
# Format:  key <space> slug <space> in/out price ($/1M) <space> description
#
# Slugs are written without a suffix. The routing suffix (:floor / :exacto)
# is applied globally by CCD_ROUTING in openrouter.env.
#
#   ccd models            Print this list (slugs to paste into /model in a session)
#   ccd pick              Assign models to the haiku/sonnet/opus slots
#   ccd -c --opus kimi    Use kimi for the opus slot this run only
#
# ccd-prewarm: flash luna kimi sol terra glm51
# The keys above are the bounded Pareto/default metadata warm set. ccd resolves
# them through this same catalog, so the launch path has no duplicate slug list.
#
# ── Selection rationale (surveyed 2026-08-02) ────────────────────────────
# The yardstick is DeepSWE v1.1: 113 contamination-free tasks with per-task cost
# published — effectively the only independently verified agentic coding benchmark.
# SWE-bench Verified/Pro scores are almost all vendor-self-reported with zero
# independent verification, so they are not used.
#
# On the Pareto frontier: luna(67.2%/$0.61) · terra(69.6%/$3.96) · sol(72.7%/$8.39)
# Dominated (better alternative at the same price): glm · pro · grok · sonnet5
# kimi is dominated on paper (terra is cheaper at a similar score) but holds the
# opus slot by explicit user choice (2026-08-02).
#
# ⚠ Caveat: most scores below were measured in Codex/Cursor harnesses. The only
#   non-Anthropic model measured in the Claude Code harness is glm51 (58.7%).
#   Real performance in our environment may be lower than the table suggests.
#   Prices shift with OpenRouter promotions.

# ── Default slot assignment ──────────────────────────────────────────────
flash   deepseek/deepseek-v4-flash   0.11/0.22    Cheapest. For exploration/grep. No independent verification (caution)
luna    openai/gpt-5.6-luna          0.10/0.60    ★Frontier. 67.2%@$0.61 — dominant value
kimi    moonshotai/kimi-k3           2.90/14.00   ★Frontier. 68.5%@$4.65 — opus slot (user choice; terra is cheaper on paper)

# ── When more is needed ──────────────────────────────────────────────────
sol     openai/gpt-5.6-sol           5.00/30.00   ★Frontier. 72.7%@$8.39 — only for truly hard problems
terra   openai/gpt-5.6-terra         1.00/6.00    ★Frontier. 69.6%@$3.96 — previous opus default
glm51   z-ai/glm-5.1                 0.98/4.30    Only model measured in Claude Code itself (58.7%)

# ── Reference: dominated options (no reason to pick) ─────────────────────
# glm   z-ai/glm-5.2                 0.33/1.03    43.8%@$3.92. Vendor claimed 82.7 -> collapsed under independent testing
# pro   deepseek/deepseek-v4-pro     0.44/0.87    Claimed SWE-V 80.6 -> DeepSWE 8%. Not trustworthy
